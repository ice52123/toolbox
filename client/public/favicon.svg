<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 校园集 favicon（矢量版）：毕业帽造型，纯 path 无 <text>，不依赖字体渲染。
       页面实际引用的是同款 favicon.png（旧内核对 SVG favicon 支持不稳） -->
  <defs>
    <linearGradient id="tbFavBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tbFavBg)" />
  <g fill="#ffffff">
    <!-- 帽板 -->
    <polygon points="32,12 58,27 32,42 6,27" />
    <!-- 帽檐 -->
    <rect x="16" y="40" width="32" height="6" />
    <!-- 顶扣 -->
    <circle cx="32" cy="10" r="3" />
    <!-- 流苏 -->
    <polygon points="31,9 33.2,9 46.5,39.5 44.3,40.5" />
  </g>
</svg>
